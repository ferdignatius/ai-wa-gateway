services:
  gateway:
    image: ferdignatius/ai-wa-gateway:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      HERMES_ENABLED: ${HERMES_ENABLED:-true}
      HERMES_URL: ${HERMES_URL:-}
      HERMES_TOKEN: ${HERMES_TOKEN:-}
      BACKEND_URL: ${BACKEND_URL:-}
      BACKEND_TOKEN: ${BACKEND_TOKEN:-}
      RATE_LIMIT: ${RATE_LIMIT:-100}
      PORT: ${PORT:-3001}
      ALLOW_PRIVATE_BACKEND: ${ALLOW_PRIVATE_BACKEND:-false}
      DISCONNECT_EXIT_MS: ${DISCONNECT_EXIT_MS:-60000}
    shm_size: 512m
    volumes:
      - wwebjs-auth:/app/.wwebjs_auth
      - wwebjs-cache:/app/.wwebjs_cache
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  wwebjs-auth:
  wwebjs-cache:
