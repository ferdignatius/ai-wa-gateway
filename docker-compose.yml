services:
  gateway:
    image: ferdignatius/ai-wa-gateway:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      BACKEND_URL: ${BACKEND_URL:?BACKEND_URL is required}
      BACKEND_TOKEN: ${BACKEND_TOKEN:?BACKEND_TOKEN is required}
      PORT: ${PORT:-3001}
      ALLOW_PRIVATE_BACKEND: ${ALLOW_PRIVATE_BACKEND:-false}
      DISCONNECT_EXIT_MS: ${DISCONNECT_EXIT_MS:-60000}
    shm_size: 256m
    volumes:
      - wwebjs-auth:/app/.wwebjs_auth
      - wwebjs-cache:/app/.wwebjs_cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  wwebjs-auth:
  wwebjs-cache:
